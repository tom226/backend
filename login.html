<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - Nursery Green</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #228a3a 0%, #1a5f2d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 450px;
            width: 100%;
            padding: 40px;
            animation: slideInUp 0.3s ease;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #228a3a;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
            color: #999;
            font-size: 14px;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #ddd;
            transform: translateY(-50%);
        }

        .divider span {
            background: white;
            padding: 0 10px;
            position: relative;
        }

        .oauth-container {
            margin-bottom: 30px;
        }

        .oauth-button {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            color: #333;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 15px;
        }

        .oauth-button:hover {
            border-color: #228a3a;
            background: #f5f5f5;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(34, 138, 58, 0.15);
        }

        .oauth-button.google {
            border-color: #db4437;
            color: #db4437;
        }

        .oauth-button.google:hover {
            background: #fef5f4;
            border-color: #db4437;
        }

        .oauth-button.facebook {
            border-color: #1877f2;
            color: #1877f2;
        }

        .oauth-button.facebook:hover {
            background: #f0f5ff;
            border-color: #1877f2;
        }

        .oauth-button svg {
            width: 20px;
            height: 20px;
        }

        .info-box {
            background: #f0f8f5;
            border-left: 4px solid #228a3a;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #333;
            line-height: 1.5;
        }

        .info-box strong {
            color: #228a3a;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #228a3a;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: #1a5f2d;
            text-decoration: underline;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #228a3a;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #228a3a;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            display: none;
            background: #fee;
            border-left: 4px solid #d32f2f;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            color: #d32f2f;
            font-size: 13px;
        }

        .success-message {
            display: none;
            background: #e8f5e9;
            border-left: 4px solid #228a3a;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            color: #228a3a;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 25px;
            }

            .logo h1 {
                font-size: 24px;
            }

            .oauth-button {
                padding: 10px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🌱 Nursery Green</h1>
            <p>Your Garden Partner</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <div class="info-box">
            <strong>👋 Welcome!</strong><br>
            Sign in to track your orders, view delivery status, and manage your account.
        </div>

        <div class="oauth-container">
            <div class="oauth-button google" onclick="loginWithGoogle()">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </div>

            <div class="oauth-button facebook" onclick="loginWithFacebook()">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill="currentColor" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
                Continue with Facebook
            </div>
        </div>

        <div class="divider">
            <span>or</span>
        </div>

        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Redirecting to login...</p>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://backend-production-f128.up.railway.app';
        const params = new URLSearchParams(window.location.search);
        const redirectTarget = params.get('redirect');

        function loginWithGoogle() {
            const redirectParam = redirectTarget ? `?redirect=${encodeURIComponent(redirectTarget)}` : '';
            window.location.href = `${BACKEND_URL}/auth/google${redirectParam}`;
        }

        function loginWithFacebook() {
            const redirectParam = redirectTarget ? `?redirect=${encodeURIComponent(redirectTarget)}` : '';
            window.location.href = `${BACKEND_URL}/auth/facebook${redirectParam}`;
        }

        // Check URL parameters for token after OAuth callback
        window.addEventListener('load', function() {
            const token = params.get('token');
            const user = params.get('user');
            const error = params.get('error');

            if (error) {
                // Show error message
                const errorMessage = document.getElementById('errorMessage');
                const errorText = error === 'google_auth_failed' ? 'Google login failed. Please try again.' : 
                                  error === 'facebook_auth_failed' ? 'Facebook login failed. Please try again.' :
                                  'Login failed. Please try again.';
                errorMessage.textContent = '✗ ' + errorText;
                errorMessage.style.display = 'block';
                return;
            }

            if (token) {
                // Save token to localStorage
                localStorage.setItem('authToken', token);
                
                // Save user data if available
                if (user) {
                    try {
                        localStorage.setItem('userData', user);
                    } catch (e) {
                        console.error('Could not save user data:', e);
                    }
                }

                // Show success message
                const successMessage = document.getElementById('successMessage');
                successMessage.textContent = '✓ Login successful! Redirecting to home...';
                successMessage.style.display = 'block';

                // Redirect back to intended page or stay
                setTimeout(() => {
                    const target = redirectTarget || 'index.html';
                    window.location.href = target;
                }, 1200);
            }
        });
    </script>
</body>
</html>
